# Two-node local test network:  docker compose up -d
# Console:  docker attach node1   (detach with Ctrl-P Ctrl-Q)
services:
  node1:
    build: .
    container_name: node1
    command: ["-easy", "-gen"]
    stdin_open: true
    tty: true
    volumes: ["node1:/data"]
    networks: { btc: { ipv4_address: 172.28.0.2 } }
  node2:
    build: .
    container_name: node2
    command: ["-easy", "-addnode=172.28.0.2:8333"]
    stdin_open: true
    tty: true
    depends_on: [node1]
    volumes: ["node2:/data"]
    networks: { btc: { ipv4_address: 172.28.0.3 } }
volumes: { node1: {}, node2: {} }
networks:
  btc:
    ipam:
      config: [{ subnet: 172.28.0.0/24 }]

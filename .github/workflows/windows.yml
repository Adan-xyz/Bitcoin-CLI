name: windows
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: gcc make pkgconf openssl-devel libdb-devel procps-ng
      - name: Show toolchain
        run: |
          gcc --version | head -1
          pkg-config --modversion openssl
          ls /usr/include/db_cxx.h /usr/lib/libdb_cxx* || true
      - name: Build and run the test suite
        run: bash test.sh
      - name: Collect runtime DLLs
        run: |
          mkdir out
          cp bitcoin.exe README.md DEVIATIONS.md LICENSE THIRD_PARTY_NOTICES.md out/
          for dll in $(ldd bitcoin.exe | awk '/\/usr\/bin\//{print $3}'); do cp "$dll" out/; done
          ls -la out
      - name: Smoke test outside MSYS2 (plain Windows, only the collected files)
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Set-Location out
          .\bitcoin.exe -h | Select-Object -First 3
          $out = "getinfo", "stop" | .\bitcoin.exe -easy -stdin -datadir="$env:RUNNER_TEMP\smoke" -port=18999
          $out
          if (-not ($out -match "network\s*: easy")) { throw "smoke test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: bitcoin-cli-windows-x86_64
          path: out
